<!DOCTYPE html>
<html>
<head>
    <title>Test POST</title>
</head>
<body>
    <h2>Test POST Request</h2>
    <button onclick="testPost()">Send POST Request</button>
    <pre id="result"></pre>
    
    <script>
        async function testPost() {
            const response = await fetch('../backend/api/forgot_password.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: 'jacksonmyula773@gmail.com' })
            });
            const text = await response.text();
            document.getElementById('result').innerHTML = text;
            
            try {
                const json = JSON.parse(text);
                if (json.reset_link) {
                    alert('Reset link: ' + json.reset_link);
                }
            } catch(e) {
                console.error('Parse error:', e);
            }
        }
    </script>
</body>
</html>
